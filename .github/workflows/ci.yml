name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres service so the Postgres repository tests run for real (they
    # self-skip when DATABASE_TEST_URL is unset, e.g. a plain local `npm test`).
    # The tests connect as a non-superuser role so row-level security applies.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build web client
        run: npm run build

      - name: Create the test database and app role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE myelotrack_app LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE myelotrack_test OWNER myelotrack_app"

      - name: Server tests
        run: npm test
        env:
          DATABASE_TEST_URL: postgres://myelotrack_app:test@localhost:5432/myelotrack_test
